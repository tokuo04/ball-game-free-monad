  typecheck:
    needs: materialize
    if: ${{ !cancelled() && needs.materialize.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyright
      - name: Pyright (strict)
        run: pyright
      - name: unittest
        run: python -m unittest discover -s tests -t .

  pages:
    needs: typecheck
    if: ${{ !cancelled() && needs.typecheck.result == 'success' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate docs/config.js from repository variable
        run: |
          if [ -n "$FIREBASE_CONFIG_JSON" ]; then
            printf 'window.FIREBASE_CONFIG = %s;\n' "$FIREBASE_CONFIG_JSON" > docs/config.js
          else
            echo "::warning::リポジトリ変数 FIREBASE_CONFIG_JSON が未設定です"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
